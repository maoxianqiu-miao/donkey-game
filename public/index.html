<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>驴桥驴桥</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root { --primary: #6366f1; --accent: #f59e0b; --bg: #f8fafc; --text: #1f2937; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; display: flex; justify-content: center; padding: 20px; }
        #game-container { background: white; width: 100%; max-width: 600px; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; }
        .hidden { display: none !important; }
        #wall { background: #f1f5f9; padding: 15px; border-radius: 12px; height: 280px; overflow-y: auto; text-align: left; margin-bottom: 20px; border: 1px solid #e2e8f0; }
        .item { padding: 10px; background: white; border-radius: 8px; margin-bottom: 8px; border-left: 5px solid var(--primary); font-size: 14px; position: relative; }
        .badge { background: var(--accent); color: white; padding: 2px 6px; border-radius: 4px; font-size: 11px; margin-right: 5px; }
        
        /* 关键词网格样式 */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; margin: 15px 0; background: #f8fafc; padding: 10px; border-radius: 12px; }
        .card { padding: 8px 2px; border: 2px solid #e2e8f0; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: bold; background: #fff; text-align: center; transition: 0.2s; }
        .card.active { border-color: var(--primary); background: #eef2ff; transform: scale(1.05); }
        .card.used { background: #e2e8f0; color: #94a3b8; cursor: not-allowed; border-color: transparent; text-decoration: line-through; }
        
        .btn-exit { background: #ef4444; color: white; padding: 5px 10px; border-radius: 8px; font-size: 12px; position: absolute; top: 20px; right: 20px; border: none; cursor: pointer; z-index: 100; }
        textarea { width: 100%; border: 2px solid #e2e8f0; border-radius: 10px; padding: 12px; box-sizing: border-box; font-size: 16px; margin-top: 10px; }
        .btn { background: var(--primary); color: white; width: 100%; padding: 12px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
        #review-msg { color: #ef4444; font-weight: bold; font-size: 18px; margin: 10px 0; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }
    </style>
</head>
<body>
<div id="game-container">
    <button id="exit-btn" class="btn-exit hidden" onclick="socket.emit('forceQuit')">结束游戏/关闭房间</button>
    <h1>🐴 驴桥 Donkey Bridge</h1>
    
    <div id="setup">
        <input type="text" id="name" placeholder="你的昵称" style="padding:10px; width:40%;">
        <input type="text" id="room" placeholder="房间号" style="padding:10px; width:40%;">
        <div id="opt" class="hidden">
            手牌(n): <input type="number" id="n" value="10" style="width:40px;"> 
            轮数(p): <input type="number" id="p" value="5" style="width:40px;">
        </div>
        <p id="plist">等待队友...</p>
        <button id="jbtn" class="btn" onclick="join()">加入游戏</button>
        <button id="sbtn" class="btn hidden" onclick="start()" style="margin-top:10px; background:var(--accent);">开始游戏</button>
    </div>

    <div id="play" class="hidden">
        <p style="font-size: 12px; color: #64748b; margin: 0;">你的关键词库：</p>
        <div id="hdisp" class="grid"></div>

        <div id="wall"></div>
        
        <div id="timer-zone" class="hidden">
            <p id="review-msg">⏱️ 全员复习时间！倒计时：<span id="seconds">10</span>s</p>
        </div>

        <div id="turn-zone">
            <div id="iarea" class="hidden">
                <h3 id="curw" style="color:var(--accent); margin:5px 0;">请先从上方选一个词</h3>
                <textarea id="itxt" placeholder="编一段有趣的故事片段..."></textarea>
                <button class="btn" onclick="sub()" style="margin-top:10px; background:var(--accent);">发 送</button>
            </div>
            <div id="wmsg">等待 <span id="pname" style="color:var(--primary); font-weight: bold;"></span> 创作...</div>
        </div>
    </div>

    <div id="recall" class="hidden">
        <h3>🧠 记忆整合</h3>
        <div id="hint-cards" style="margin-bottom: 10px;"></div>
        <textarea id="rans" rows="5" placeholder="空格或逗号隔开所有关键词..."></textarea>
        <button class="btn" onclick="sendScore()" style="margin-top:15px">提交</button>
    </div>

    <div id="result" class="hidden">
        <h3>🏆 记忆排行</h3>
        <div id="leaderboard"></div>
        <div id="typer" style="text-align:left; background:#1e293b; color:#fff; padding:15px; border-radius:10px; margin-top:10px; font-size:14px;"></div>
        <button class="btn" onclick="location.reload()" style="margin-top:20px; background:#475569;">回首页</button>
    </div>
</div>

<script>
    const socket = io({ transports: ['websocket'] });
    let myHand = [], usedWords = [], currentWord = "", isMyTurn = false;

    function join() {
        const n = document.getElementById('name').value, r = document.getElementById('room').value;
        if(n && r) { socket.emit('joinRoom', { name: n, room: r }); document.getElementById('jbtn').classList.add('hidden'); }
    }
    socket.on('initInfo', d => { if(d.isOwner) { document.getElementById('opt').classList.remove('hidden'); document.getElementById('sbtn').classList.remove('hidden'); } });
    socket.on('updatePlayers', l => document.getElementById('plist').innerText = "当前房间：" + l.map(p=>p.name).join(', '));
    socket.on('roomClosed', m => { alert(m); location.reload(); });

    function start() { socket.emit('startGame', { n: document.getElementById('n').value, p: document.getElementById('p').value }); }
    socket.on('gameStarted', () => { document.getElementById('setup').classList.add('hidden'); document.getElementById('play').classList.remove('hidden'); document.getElementById('exit-btn').classList.remove('hidden'); });
    
    socket.on('receiveHand', d => { myHand = d.hand; renderHand(); });

    socket.on('nextTurn', d => {
        isMyTurn = d.activeID === socket.id;
        document.getElementById('wmsg').classList.toggle('hidden', isMyTurn);
        document.getElementById('pname').innerText = d.activeName;
        document.getElementById('iarea').classList.toggle('hidden', !isMyTurn);
        renderHand();
    });

    // 渲染手牌，区分状态
    function renderHand() {
        const g = document.getElementById('hdisp');
        g.innerHTML = '';
        myHand.forEach(w => {
            const isUsed = usedWords.includes(w);
            let v = document.createElement('div');
            v.className = 'card' + (isUsed ? ' used' : '') + (w === currentWord ? ' active' : '');
            v.innerText = w;
            if(!isUsed && isMyTurn) {
                v.onclick = () => { 
                    currentWord = w; 
                    document.getElementById('curw').innerText = "当前词：" + w;
                    renderHand(); 
                };
            }
            g.appendChild(v);
        });
    }

    function sub() {
        const t = document.getElementById('itxt').value;
        if(!currentWord || !t.trim()) return alert("请先选词并写下故事！");
        socket.emit('submitStory', { word: currentWord, text: t });
        usedWords.push(currentWord);
        currentWord = "";
        document.getElementById('itxt').value = '';
        renderHand();
    }

    socket.on('syncWall', d => {
        document.getElementById('wall').innerHTML = d.storyPool.map((s, i) => `
            <div class="item">
                <span class="badge">${s.word}</span><b>${s.player}:</b> ${s.text}
                ${(i === d.storyPool.length-1) ? `<button style="float:right; scale:0.7;" onclick="socket.emit('protest')">抗议重写</button>` : ''}
            </div>`).join('');
        document.getElementById('wall').scrollTop = document.getElementById('wall').scrollHeight;
    });

    socket.on('timeRewind', d => {
        // 抗议后，把词从“已用”里拿出来，并自动填回文字
        usedWords = usedWords.filter(w => w !== d.word);
        currentWord = d.word;
        document.getElementById('curw').innerText = "重新编写：" + d.word;
        document.getElementById('itxt').value = d.oldText;
        renderHand();
    });

    socket.on('startReviewTimer', s => {
        document.getElementById('turn-zone').classList.add('hidden');
        document.getElementById('timer-zone').classList.remove('hidden');
        let count = s;
        const timer = setInterval(() => {
            count--;
            document.getElementById('seconds').innerText = count;
            if(count <= 0) clearInterval(timer);
        }, 1000);
    });

    socket.on('startRecallPhase', d => {
        document.getElementById('play').classList.add('hidden');
        document.getElementById('recall').classList.remove('hidden');
        document.getElementById('hint-cards').innerHTML = d.myHints.map(h => `<span style="background:#fef3c7; padding:5px 10px; border-radius:15px; margin:5px; display:inline-block; font-weight:bold;">${h}</span>`).join('');
        window.allStories = d.stories;
    });

    function sendScore() {
        const ans = document.getElementById('rans').value.split(/[\s,，、\n]+/).filter(x=>x);
        const targets = window.allStories.map(s => s.word);
        const correct = [...new Set(ans)].filter(x => targets.includes(x)).length;
        socket.emit('submitScore', Math.round(correct / targets.length * 100));
        document.getElementById('recall').innerHTML = "<h4>已提交，等待其他玩家...</h4>";
    }

    socket.on('finalResults', d => {
        document.getElementById('recall').classList.add('hidden');
        document.getElementById('result').classList.remove('hidden');
        document.getElementById('leaderboard').innerHTML = d.leaderboard.map((u, i) => `<div style="padding:10px; border-bottom:1px solid #eee;"><b>${i+1}. ${u.name}</b>: ${u.score}%</div>`).join('');
        d.stories.forEach(s => { let l = document.createElement('div'); l.innerHTML = `<b>[${s.word}]</b> ${s.text}`; document.getElementById('typer').appendChild(l); });
    });
</script>
</body>
</html>
