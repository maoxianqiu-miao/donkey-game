<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>驴桥 Donkey Bridge - 联机版</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root { --primary: #6366f1; --accent: #f59e0b; --bg: #f8fafc; }
        body { font-family: sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; }
        #game-box { background: white; width: 100%; max-width: 600px; padding: 30px; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); text-align: center; }
        .hidden { display: none !important; }
        .status-bar { display: flex; justify-content: space-between; background: #f1f5f9; padding: 12px; border-radius: 12px; margin-bottom: 20px; font-weight: bold; }
        #history-display { background: #f0f9ff; color: #0369a1; padding: 15px; border-radius: 12px; margin-bottom: 15px; text-align: left; border-left: 5px solid #0ea5e9; max-height: 200px; overflow-y: auto; font-size: 14px; }
        .history-item { margin-bottom: 8px; border-bottom: 1px dashed #bae6fd; padding-bottom: 4px; }
        .hand-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; margin: 20px 0; }
        .card { padding: 15px 10px; border: 2px solid #e2e8f0; border-radius: 12px; cursor: pointer; background: #fff; font-weight: bold; }
        .card.done { background: #f1f5f9; color: #cbd5e1; text-decoration: line-through; }
        .card.active { border-color: var(--accent); background: #fffbeb; }
        textarea { width: 100%; border: 2px solid #e2e8f0; border-radius: 12px; padding: 15px; box-sizing: border-box; outline: none; font-size: 16px; margin-top: 10px; }
        button { padding: 14px; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.2s; margin-top: 10px; }
        .btn-main { background: var(--primary); color: white; }
        .btn-accent { background: var(--accent); color: white; }
        #typer-container { text-align: left; background: #2d3436; color: #dfe6e9; padding: 20px; border-radius: 12px; font-family: monospace; margin-top: 20px; line-height: 1.6; }
        .history-card { background: #fff; padding: 12px; border-radius: 8px; margin-bottom: 10px; border-left: 5px solid var(--accent); color: #333; }
    </style>
</head>
<body>
<div id="game-box">
    <h1>驴桥 Donkey Bridge</h1>

    <div id="screen-setup">
        <input type="text" id="nick" placeholder="输入你的昵称" style="width:80%; padding:12px; margin-bottom:20px; border-radius:8px; border:2px solid #ddd;">
        <div style="background:#f1f5f9; padding:20px; border-radius:15px; margin-bottom:20px; text-align: left;">
            人数 (m): <input type="number" id="m-val" value="2" style="width:50px;"><br>
            手牌 (n): <input type="number" id="n-val" value="10" style="width:50px;"><br>
            轮次 (p): <input type="number" id="p-val" value="5" style="width:50px;">
        </div>
        <button class="btn-main" onclick="ready()">开始游戏</button>
    </div>

    <div id="screen-play" class="hidden">
        <div class="status-bar">
            <span>当前玩家: <span id="p-name" style="color:var(--primary)">-</span></span>
            <span id="wait-msg" style="font-size:12px; color:gray;">(等待中)</span>
        </div>
        
        <div id="history-display" class="hidden"></div>

        <div class="hand-grid" id="hand-display"></div>
        <div id="story-area" class="hidden">
            <h3 id="active-word" style="color:var(--accent); margin:5px 0;"></h3>
            <textarea id="story-text" rows="3" placeholder="接着之前的故事写下去..."></textarea>
            <button class="btn-accent" onclick="submit()">提交这段故事</button>
        </div>
    </div>

    <div id="screen-recall" class="hidden">
        <h2>🧠 默写挑战</h2>
        <div id="aid-cards-display" style="margin-bottom:15px;"></div>
        <textarea id="recall-input" placeholder="输入你记得的所有关键词，空格隔开..."></textarea>
        <button class="btn-main" onclick="finish()">提交答案</button>
    </div>

    <div id="screen-res" class="hidden">
        <h2>📊 最终得分</h2>
        <div id="rank-list" style="margin-bottom:20px;"></div>
        <hr>
        <div id="typer-container"></div>
        <button class="btn-main" onclick="location.reload()">再来一局</button>
    </div>
</div>

<script>
    const socket = io();
    let myName, handData = [], globalPool = [];

    function ready() {
        myName = document.getElementById('nick').value;
        if(!myName) return alert("请输入昵称");
        const cfg = { 
            m: parseInt(document.getElementById('m-val').value), 
            n: parseInt(document.getElementById('n-val').value), 
            p: parseInt(document.getElementById('p-val').value) 
        };
        socket.emit('join', myName);
        socket.emit('startGame', cfg);
    }

    socket.on('initHand', data => {
        handData = data.hand.map(w => ({ word: w, done: false }));
        document.getElementById('screen-setup').classList.add('hidden');
        document.getElementById('screen-play').classList.remove('hidden');
        renderHand(false);
    });

    socket.on('nextTurn', data => {
        const isMe = data.name === myName;
        document.getElementById('p-name').innerText = data.name;
        document.getElementById('wait-msg').classList.toggle('hidden', isMe);
        document.getElementById('story-area').classList.add('hidden');
        
        // 渲染全景故事
        const historyDiv = document.getElementById('history-display');
        if (data.fullStory && data.fullStory.length > 0) {
            historyDiv.innerHTML = `<div style="font-weight:bold; color:#0369a1;">📖 故事前情提要：</div>` + 
                data.fullStory.map(s => `<div class="history-item"><b>${s.player}</b>: ${s.text}</div>`).join('');
            historyDiv.classList.remove('hidden');
            historyDiv.scrollTop = historyDiv.scrollHeight;
        } else {
            historyDiv.classList.add('hidden');
        }

        renderHand(isMe);
    });

    function renderHand(isMe) {
        const grid = document.getElementById('hand-display');
        grid.innerHTML = handData.map((item, i) => {
            const cls = item.done ? 'card done' : 'card';
            const click = (isMe && !item.done) ? `onclick="selectWord(${i})"` : '';
            return `<div class="${cls}" ${click}>${item.word}</div>`;
        }).join('');
    }

    function selectWord(i) {
        window.activeIdx = i;
        document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById('story-area').classList.remove('hidden');
        document.getElementById('active-word').innerText = `当前词：${handData[i].word}`;
        document.getElementById('story-text').focus();
    }

    function submit() {
        const text = document.getElementById('story-text').value;
        if(!text) return alert("写点什么吧");
        socket.emit('submitStory', { word: handData[window.activeIdx].word, story: text });
        handData[window.activeIdx].done = true;
        document.getElementById('story-text').value = '';
        document.getElementById('story-area').classList.add('hidden');
        renderHand(false);
    }

    socket.on('startRecall', data => {
        globalPool = data.storyPool;
        document.getElementById('screen-play').classList.add('hidden');
        document.getElementById('screen-recall').classList.remove('hidden');
        document.getElementById('aid-cards-display').innerHTML = data.aidWords.map(w => `<span style="background:#fef3c7; padding:5px 10px; border-radius:15px; margin:3px; display:inline-block;">${w}</span>`).join('');
    });

    function finish() {
        const input = document.getElementById('recall-input').value;
        const userWords = input.split(/[\s,，、]+/).filter(w => w.trim());
        const hits = globalPool.filter(item => userWords.includes(item.word)).length;
        const score = Math.round(hits / globalPool.length * 100);
        socket.emit('submitRecall', { score });
        document.getElementById('screen-recall').innerHTML = "<h3>等待交卷中...</h3>";
    }

    socket.on('finalRank', data => {
        document.getElementById('screen-recall').classList.add('hidden');
        document.getElementById('screen-res').classList.remove('hidden');
        document.getElementById('rank-list').innerHTML = data.scores.sort((a,b)=>b.score-a.score).map((s,i)=>`<div>#${i+1} <b>${s.name}</b> - ${s.score}%</div>`).join('');
        playTyper(data.storyPool);
    });

    async function playTyper(pool) {
        const container = document.getElementById('typer-container');
        container.innerHTML = "<h4>📖 最终全本故事：</h4>";
        for (let item of pool) {
            let card = document.createElement('div');
            card.className = 'history-card';
            card.innerHTML = `<strong>【${item.player}】(${item.word})</strong>: `;
            container.appendChild(card);
            for (let char of item.text) { 
                card.innerHTML += char; 
                await new Promise(r => setTimeout(r, 45)); 
            }
        }
    }

    socket.on('forceReset', () => { location.reload(); });
</script>
</body>
</html>
