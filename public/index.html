<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>驴桥 Donkey Bridge - 联机稳定版</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root { --primary: #6366f1; --accent: #f59e0b; --bg: #f8fafc; }
        body { font-family: 'PingFang SC', sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; }
        #game-container { background: white; width: 100%; max-width: 600px; padding: 30px; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); text-align: center; }
        .hidden { display: none !important; }
        .status-bar { display: flex; justify-content: space-between; padding: 12px; background: #f1f5f9; border-radius: 12px; margin-bottom: 15px; font-weight: bold; }
        .hand-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; margin: 15px 0; }
        .card { padding: 12px 8px; border: 2px solid #e2e8f0; border-radius: 12px; cursor: pointer; background: #fff; font-weight: bold; }
        .card.done { background: #f1f5f9; color: #cbd5e1; text-decoration: line-through; }
        .card.active { border-color: var(--accent); }
        textarea { width: 100%; border: 2px solid #e2e8f0; border-radius: 12px; padding: 12px; box-sizing: border-box; outline: none; }
        .aid-tag { background: #fef3c7; color: #92400e; padding: 8px 16px; border-radius: 30px; font-weight: bold; border: 1px solid #fcd34d; display: inline-block; margin: 5px; }
        button { padding: 12px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; }
        .btn-main { background: var(--primary); color: white; }
        .btn-accent { background: var(--accent); color: white; }
        #typer-container { text-align: left; background: #2d3436; color: #dfe6e9; padding: 15px; border-radius: 12px; font-family: monospace; margin-top: 15px; }
        .history-card { background: #fff; padding: 10px; border-radius: 8px; margin-bottom: 8px; border-left: 5px solid var(--accent); color: #333; }
    </style>
</head>
<body>
<div id="game-container">
    <h1>驴桥 Donkey Bridge</h1>

    <div id="setup-screen">
        <input type="text" id="nick" placeholder="昵称" style="width:150px; padding:8px; margin-bottom:15px; border-radius:8px; border:1px solid #ddd;">
        <div style="background:#f1f5f9; padding:15px; border-radius:12px; margin-bottom:15px; text-align: left;">
            人数 (m): <input type="number" id="m-val" value="2" style="width:40px;"><br>
            手牌 (n): <input type="number" id="n-val" value="10" style="width:40px;"><br>
            轮次 (p): <input type="number" id="p-val" value="5" style="width:40px;">
        </div>
        <button class="btn-main" onclick="ready()">开始游戏</button>
    </div>

    <div id="play-screen" class="hidden">
        <div class="status-bar">
            <span>当前: <span id="player-name" style="color:var(--primary)">-</span></span>
            <span id="wait-msg" style="font-size:12px; color:gray;">(等待他人)</span>
        </div>
        <div class="hand-grid" id="hand-display"></div>
        <div id="story-area" class="hidden">
            <h3 id="active-word" style="color:var(--accent); margin:10px 0;"></h3>
            <textarea id="story-text" rows="3" placeholder="编写故事..."></textarea>
            <button class="btn-accent" style="margin-top:10px" onclick="submit()">提交故事</button>
        </div>
    </div>

    <div id="recall-screen" class="hidden">
        <h2>🧠 默写挑战</h2>
        <div style="background:#fff7ed; padding:15px; border-radius:15px; margin-bottom:15px;">
            <p id="aid-tip" style="margin:0 0 10px 0; font-size:14px; color:#c2410c;">加载提示词中...</p>
            <div id="aid-cards-display"></div>
        </div>
        <textarea id="recall-input" placeholder="输入全部词语，空格隔开..."></textarea>
        <button class="btn-main" style="margin-top:10px" onclick="finishRecall()">提交我的准确率</button>
    </div>

    <div id="result-screen" class="hidden">
        <h2>📊 战报</h2>
        <div id="rank-list"></div>
        <hr>
        <div id="typer-container"></div>
        <button class="btn-main" onclick="location.reload()" style="margin-top:15px">回主页</button>
    </div>
</div>

<script>
    const socket = io();
    let myName, handData = [], globalPool = [];

    function ready() {
        myName = document.getElementById('nick').value;
        const cfg = {
            m: parseInt(document.getElementById('m-val').value),
            n: parseInt(document.getElementById('n-val').value),
            p: parseInt(document.getElementById('p-val').value)
        };
        if(!myName) return alert("写个名字");
        socket.emit('join', myName);
        socket.emit('startGame', cfg);
    }

    socket.on('initHand', data => {
        handData = data.hand.map(w => ({ word: w, done: false }));
        document.getElementById('setup-screen').classList.add('hidden');
        document.getElementById('play-screen').classList.remove('hidden');
        renderHand(false);
    });

    socket.on('nextTurn', data => {
        const isMe = data.name === myName;
        document.getElementById('player-name').innerText = data.name;
        document.getElementById('wait-msg').classList.toggle('hidden', isMe);
        document.getElementById('story-area').classList.add('hidden');
        renderHand(isMe);
    });

    function renderHand(isMe) {
        const grid = document.getElementById('hand-display');
        grid.innerHTML = handData.map((item, i) => {
            const cls = item.done ? 'card done' : 'card';
            const click = (isMe && !item.done) ? `onclick="selectWord(${i})"` : '';
            return `<div class="${cls}" ${click}>${item.word}</div>`;
        }).join('');
    }

    function selectWord(i) {
        window.activeIdx = i;
        document.getElementById('story-area').classList.remove('hidden');
        document.getElementById('active-word').innerText = handData[i].word;
        document.getElementById('story-text').focus();
    }

    function submit() {
        const text = document.getElementById('story-text').value;
        if(!text) return;
        socket.emit('submitStory', { word: handData[window.activeIdx].word, story: text });
        handData[window.activeIdx].done = true;
        document.getElementById('story-text').value = '';
        document.getElementById('story-area').classList.add('hidden');
        renderHand(false);
    }

    socket.on('startRecall', data => {
        console.log("收到提示词:", data.aidWords);
        globalPool = data.storyPool;
        document.getElementById('play-screen').classList.add('hidden');
        document.getElementById('recall-screen').classList.remove('hidden');
        
        document.getElementById('aid-tip').innerText = `属于你的 ${data.aidWords.length} 个专属提示词：`;
        const aidBox = document.getElementById('aid-cards-display');
        aidBox.innerHTML = data.aidWords.map(w => `<span class="aid-tag">${w}</span>`).join('');
    });

    function finishRecall() {
        const input = document.getElementById('recall-input').value;
        const userWords = input.split(/[\s,，、]+/).filter(w => w.trim());
        const hits = globalPool.filter(item => userWords.includes(item.word)).length;
        const score = Math.round(hits / globalPool.length * 100);
        socket.emit('submitRecall', { score });
        document.getElementById('recall-screen').innerHTML = "<h3>等待他人提交...</h3>";
    }

    socket.on('finalRank', data => {
        document.getElementById('recall-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        document.getElementById('rank-list').innerHTML = data.scores
            .sort((a,b) => b.score - a.score)
            .map((s, i) => `<div>${i+1}. <b>${s.name}</b>: ${s.score}%</div>`).join('');
        playTyper(data.storyPool);
    });

    async function playTyper(pool) {
        const container = document.getElementById('typer-container');
        for (let item of pool) {
            let card = document.createElement('div');
            card.className = 'history-card';
            card.innerHTML = `<strong>[${item.player}-${item.word}]</strong>: `;
            container.appendChild(card);
            for (let char of item.text) {
                card.innerHTML += char;
                await new Promise(r => setTimeout(r, 45));
            }
        }
    }

    socket.on('forceReset', () => location.reload());
</script>
</body>
</html>
